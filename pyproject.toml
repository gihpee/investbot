[project]
name = "investbot"
version = "0.1.0"
description = "Личный ИИ-аналитик инвестиций для рынка РФ: read-only Т-Инвестиции, MOEX, Telegram"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6.0",
    "httpx>=0.27,<1",
    "structlog>=24.4",
    "aiogram>=3.20,<4",
    "numpy>=2.0",
    "scipy>=1.14",
    "certifi",
    "apscheduler>=3.11,<4",
    "feedparser>=6.0.11",
    "datasketch>=1.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
]

[project.optional-dependencies]
# Официальный SDK живёт только в GitLab-индексе Т-Банка (PyPI-проект в карантине), см. docs/research/01-tinvest-api.md.
# Ставится отдельно: см. README, раздел «SDK Т-Инвестиций».

[project.scripts]
investbot = "investbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма для проекта

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["investbot"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["investbot.core.*", "investbot.portfolio.*", "investbot.rebalance.*", "investbot.allocation.*"]
strict = true

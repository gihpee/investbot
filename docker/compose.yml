# Развёртывание (docs/DEPLOY.md). Запуск через обёртку ops/compose.sh — она передаёт .env из корня проекта.
#   ops/compose.sh up -d --build                — бот и Postgres
#   ops/compose.sh --profile tunnel up -d       — плюс SOCKS-туннель к зарубежному серверу (Telegram/LLM)
#   ops/compose.sh run --rm bot doctor          — проверка конфигурации и сети из контейнера
name: investbot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: investbot
      POSTGRES_USER: investbot
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investbot -d investbot"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      secrets: [ca_bundle]          # для установки SDK Т-Инвестиций из индекса Т-Банка при сборке
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../.env
    environment:
      INVESTBOT_CA_BUNDLE: /app/data/local/ca-bundle.pem
      INVESTBOT_DATA_DIR: /app/data/local
      PG_PASSWORD_FILE: /run/secrets/pg_password   # пароль подставляется из секрета, в .env его нет
    secrets: [pg_password]
    command: ["bot"]                # другие команды: ops/compose.sh run --rm bot doctor --network
    user: "${INVESTBOT_UID:-10001}:${INVESTBOT_GID:-10001}"   # = владелец data/local на сервере
    volumes:
      - ../data/local:/app/data/local   # состояние: IPS, анкета, кэши, CA bundle, блокировка планировщика
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  tunnel:
    profiles: ["tunnel"]
    build: {context: tunnel}
    environment:
      TUNNEL_HOST: ${TUNNEL_HOST:-}
      TUNNEL_USER: ${TUNNEL_USER:-tunnel}
      TUNNEL_PORT: ${TUNNEL_PORT:-22}
    secrets: [tunnel_key, tunnel_known_hosts]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

secrets:
  pg_password:
    file: ../secrets/pg_password          # случайный пароль; каталог secrets/ не в git
  ca_bundle:
    file: ../data/local/ca-bundle.pem      # системные корни + сертификаты Минцифры (docs/DEPLOY.md, шаг 4)
  tunnel_key:
    file: ../secrets/tunnel_key            # только для профиля tunnel: приватный SSH-ключ к зарубежному серверу
  tunnel_known_hosts:
    file: ../secrets/tunnel_known_hosts

volumes:
  pgdata:

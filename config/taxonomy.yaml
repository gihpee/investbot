# Закрытая таксономия событий для разметки новостей (ARCHITECTURE §8.2 п. 5), версия 1.
# Читает investbot.news.taxonomy.load_taxonomy. Набор кодов зафиксирован в коде (EVENT_TYPES_V1) и в схеме
# выхода Tagger: добавить или переименовать событие можно только новой версией таксономии вместе с кодом и промптом.
#
# Поля:
#   code        — код события: пишется в news_annotation.event_type
#   group       — corporate | regulatory | credit | macro_dfa | other
#   title       — короткая подпись для пользователя
#   description — определение для промпта Tagger: когда выбирать это событие
version: 1

events:
  # --- корпоративные -------------------------------------------------------------------------------------
  - code: dividend_announce
    group: corporate
    title: дивиденды
    description: "Рекомендация совета директоров, решение собрания, объявление размера или даты отсечки дивидендов; дивидендная политика без снижения выплат."
  - code: dividend_cut
    group: corporate
    title: снижение или отмена дивидендов
    description: "Отказ от дивидендов, рекомендация не платить, выплата заметно ниже ожиданий или прошлого года, ухудшение дивидендной политики."
  - code: buyback
    group: corporate
    title: обратный выкуп
    description: "Объявление, продление, завершение или отмена программы обратного выкупа акций; выкуп у несогласных акционеров."
  - code: spo_ipo
    group: corporate
    title: размещение акций
    description: "IPO, SPO, допэмиссия акций, продажа крупного пакета существующими акционерами (ABO, cash-out)."
  - code: m_and_a
    group: corporate
    title: сделка M&A
    description: "Покупка или продажа бизнеса и активов, слияние, поглощение, обязательное или добровольное предложение, реорганизация, смена контролирующего акционера."
  - code: reporting
    group: corporate
    title: отчётность
    description: "Финансовые или операционные результаты за период (МСФО, РСБУ, операционные данные), в том числе публикация отчётности и её оценка."
  - code: guidance
    group: corporate
    title: прогноз компании
    description: "Прогноз или ориентиры менеджмента по выручке, прибыли, добыче, капзатратам, долговой нагрузке; стратегия с количественными целями."
  - code: management
    group: corporate
    title: менеджмент и совет директоров
    description: "Смена генерального директора, финансового директора, состава совета директоров; конфликт акционеров, уголовные дела против менеджмента."

  # --- регуляторные ---------------------------------------------------------------------------------------
  - code: sanctions
    group: regulatory
    title: санкции
    description: "Введение, расширение или снятие санкций против компании, её акционеров или отрасли; ограничения на экспорт или импорт, затрагивающие компанию."
  - code: regulatory_fine
    group: regulatory
    title: штраф или регуляторное решение
    description: "Штраф, предписание, иск или проверка регулятора (ФАС, ЦБ, ФНС, Роскомнадзор); изменение налогов, пошлин, тарифов, затрагивающее компанию."
  - code: delisting_marking
    group: regulatory
    title: делистинг или смена листинга
    description: "Делистинг, перевод между уровнями листинга, присвоение или снятие пометки биржи или ЦБ (для квалифицированных инвесторов, повышенный риск)."

  # --- кредитные ------------------------------------------------------------------------------------------
  - code: rating_up
    group: credit
    title: повышение рейтинга
    description: "Повышение кредитного рейтинга эмитента или выпуска агентством (АКРА, Эксперт РА, НКР, НРА), улучшение прогноза."
  - code: rating_down
    group: credit
    title: понижение рейтинга
    description: "Понижение кредитного рейтинга эмитента или выпуска, ухудшение прогноза."
  - code: rating_watch
    group: credit
    title: рейтинг на пересмотре
    description: "Рейтинг помещён в список на пересмотр (под наблюдение) с любым направлением."
  - code: rating_withdraw
    group: credit
    title: отзыв рейтинга
    description: "Отзыв рейтинга агентством или отказ эмитента от рейтинга."
  - code: tech_default
    group: credit
    title: технический дефолт
    description: "Задержка выплаты купона, амортизации, погашения или оферты в пределах льготного периода; технический дефолт."
  - code: default
    group: credit
    title: дефолт
    description: "Неисполнение обязательств по облигациям после льготного периода, реструктуризация долга, банкротство, наблюдение."
  - code: offer_put_call
    group: credit
    title: оферта
    description: "Оферта по облигациям (пут или колл), объявление досрочного погашения, итоги оферты."
  - code: coupon_reset
    group: credit
    title: новый купон
    description: "Установление ставки купона на новый период, изменение формулы плавающего купона."
  - code: covenant
    group: credit
    title: ковенанты
    description: "Нарушение или изменение ковенантов, требования о досрочном погашении, изменение условий выпуска по решению владельцев облигаций."

  # --- макро и ЦФА ----------------------------------------------------------------------------------------
  - code: key_rate
    group: macro_dfa
    title: ключевая ставка
    description: "Решение Банка России по ключевой ставке, сигналы и прогнозы ЦБ по ставке."
  - code: macro
    group: macro_dfa
    title: макроэкономика
    description: "Инфляция, курс рубля, бюджет, ВВП, цены на сырьё и другие макрособытия без отдельной компании в центре новости."
  - code: dfa_issue
    group: macro_dfa
    title: выпуск ЦФА
    description: "Выпуск, размещение или погашение цифровых финансовых активов (ЦФА) компании."
  - code: dfa_default
    group: macro_dfa
    title: дефолт по ЦФА
    description: "Неисполнение обязательств по ЦФА, задержка выплат по ЦФА."

  # --- прочее ---------------------------------------------------------------------------------------------
  - code: other
    group: other
    title: прочее
    description: "Ничего из перечисленного: продукты, обзоры рынка, интервью, аналитика без нового события."

    poll_sec: 900  # 100 элементов / ~4,6 ч
    priority: P1
    q_src: 0.8  # оценка: в таблице q_src (docs/research/04) ПРАЙМ нет
    enabled: true
    tos_ml_allowed: true

  # Не отвечал ни с NL-IP (таймаут), ни с GB-IP (401); URL из практики прошлых лет, не проверен.
  # Пометка: проверить с российского IP в Ф0, после проверки — enabled: true.
  - key: rbc
    title: "РБК"
    kind: rss
    url: "https://rssexport.rbc.ru/rbcnews/news/30/full.rss"
    poll_sec: 900
    priority: P1
    q_src: 0.9
    enabled: false
    tos_ml_allowed: true

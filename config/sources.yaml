    poll_sec: 600  # 97 элементов / ~1,75 ч — опрос ≤ 10 мин
    priority: P1
    q_src: 0.8  # оценка: в таблице q_src (docs/research/04) РИА нет
    enabled: true
    tos_ml_allowed: true

  # С NL-IP не отвечали; с GB-IP 2026-10-09 — 200, только заголовки. Пометка: проверить с российского IP в Ф0.
  - key: prime

# Ручной словарь алиасов для связывания новостей с бумагами (ARCHITECTURE §8.2 п. 4, §8.3 Ф2a).
# Скопируйте в config/aliases.yaml. Тикер, ISIN и название из справочника T-Invest подхватываются сами,
# здесь — бренды и короткие формы, которых в справочнике нет.
#
# Как ищется алиас (investbot.news.linking):
#   - фраза из нескольких слов — подряд, без учёта пунктуации и кавычек («Т-Банк» = «Т Банк»);
#   - первое слово в тексте — с заглавной буквы; алиас короче 5 букв, записанный капсом (ВТБ), — только капсом;
#   - падежи: слово от 5 букв без окончания + до 3 кириллических букв («Норникеля», «Пятерочкой»);
#     короче — только точная форма, поэтому падежные формы коротких брендов перечисляйте явно («Сбер», «Сбера»).
# Тикеры — в кавычках, если похожи на слово YAML (ON, NO, YES, TRUE).

aliases:
  SBER: [Сбер, Сбера, Сберу, Сбером]
  SBERP: [Сбер, Сбера, Сберу, Сбером]
  GMKN: [Норникель]
  T: [Т-Банк, Т-Технологии, Тинькофф]  # тикер из одной буквы как токен не ищется
  X5: [X5 Group, Пятерочка, Перекресток]
  VTBR: [ВТБ]
  YDEX: [Яндекс]
  OZON: [Ozon]
  HEAD: [HeadHunter, Хэдхантер]  # сам тикер HEAD в стоп-листе: английское слово

# Названия-омонимы: по названию не связываются до Ф3 (тикер, ISIN и связи API работают).
# Дополняют встроенный список DEFAULT_AMBIGUOUS: Магнит, Полюс, Система, Самолет, Лента, Эталон, Позитив,
# Positive, Белуга, Ренессанс, Мосбиржа, Московская биржа.
ambiguous:
  - Черкизово  # район Москвы
  - Сегежа  # город

# false — список выше заменяет встроенный, а не дополняет его.
ambiguous_defaults: true

# Конструктор аллокации (ARCHITECTURE §10.8): параметры по умолчанию.
# Читает investbot.allocation.config.load_allocation_config. Числа — не рекомендация и не прогноз.
version: 1

# «Растущие» бакеты: вариант C максимизирует их суммарную долю в пределах риска анкеты.
growth_buckets: [equity_ru, corp_ig, corp_hy]

# λ в варианте C: штраф λ·Σ|w − w_B| удерживает диверсификацию около варианта B.
diversification_lambda: 0.1

# Шаг сетки итоговых долей (0,5%).
grid_step: 0.005

# Необязательный лимит недельного CVaR95 для варианта C (положительная доля убытка, null — без лимита).
max_cvar95_weekly: null

# Стресс-сценарии. Ограничение для всех вариантов: доходность портфеля в сценарии ≥ −max_drawdown анкеты.
# historical: накопленная доходность прокси-рядов за недели, закончившиеся в окне [start, end]
#   (купить и держать с начала окна). Окно, не покрытое данными, пропускается с пометкой в карточке.
# shock: мгновенный гипотетический шок по бакетам; бакет без шока считается неизменным.
scenarios:
  - name: "Рублёвый кризис, декабрь 2014"
    kind: historical
    start: 2014-12-01
    end: 2014-12-31

  - name: "Шок февраль–март 2022"
    kind: historical
    start: 2022-02-01
    end: 2022-03-31

  - name: "Кризис осени 2008"   # прокси-ряды ISS с 2014 года его обычно не покрывают — тогда пропуск
    kind: historical
    start: 2008-09-01
    end: 2008-12-31

  # ВНИМАНИЕ: размеры шоков ниже — ДОПУЩЕНИЯ, их нужно откалибровать (вопрос открыт).
  # Облигации: ΔP ≈ −D·Δy (дюрация D в годах, Δy — сдвиг доходности), плюс расширение спреда для корпоративных.
  - name: "Ставка ЦБ +5 п.п."
    kind: shock
    shocks:
      equity_ru: -0.20         # допущение: сжатие мультипликаторов при росте ставки
      ofz_fixed: -0.175        # −D·Δy при D ≈ 3,5 года (диапазон 3–4 → −0,15…−0,20), Δy = +5 п.п.
      ofz_float_linker: -0.03  # допущение: флоатеры почти не теряют, линкеры — частично
      corp_ig: -0.12           # D ≈ 2 года, Δy = +5 п.п. + 1 п.п. расширения спреда
      corp_hy: -0.15           # D ≈ 1,5 года, Δy = +5 п.п. + 3 п.п. спреда, плюс дефолтный риск
      money_market: 0.0        # мгновенно не теряет; доход растёт вслед за ставкой
      gold: -0.05              # допущение: укрепление рубля при жёсткой ДКП
      fx_cash: -0.05           # допущение: укрепление рубля при жёсткой ДКП
      dfa: -0.07               # как облигации того же рейтинга (D ≈ 1) со штрафом за неликвидность

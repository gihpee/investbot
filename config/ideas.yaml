# Идеи для входа v1 — облигации (ARCHITECTURE §12.1–12.3, метрики §7.2).
# Читает investbot.ideas.config.load_ideas_config. Числа — параметры модели, не рекомендация и не прогноз.
# Единицы: доли (0.003 = 0,3%), годы, календарные дни; б.п. — только где явно сказано.
version: 1

# --- Горизонт и срок жизни идеи ---
horizon_weeks: 26        # горизонт = min(26 недель, срок до оферты/выкупа/погашения)
valid_days: 21           # срок действия плана входа (§12.3: 2–4 недели)
min_days_to_event: 14    # оферта/выкуп/погашение ближе 14 календарных дней (≈ 10 рабочих) — бумага исключается

# --- Вселенная (рублёвые облигации с фиксированным купоном: ОФЗ и корпоративные не ниже ig_min_rating IPS) ---
min_duration_years: 0.5  # дюрация Маколея, годы
max_duration_years: 8
# Ликвидность за ОДНУ сессию (NUMTRADES, VALTODAY из ISS marketdata) — прокси ADV20 из §7.2,
# пока нет 20-дневной истории оборотов. Перед открытием торгов поля могут относиться к прошлой сессии.
min_trades: 10
min_val_today: 2000000   # ₽ (порог ADV класса по умолчанию — 2 млн ₽, диапазон параметра 1–3 млн)

# --- Барьер издержек: alpha_net = carry + roll − EL − 2 × (комиссия + полуспред) > порога, за горизонт ---
min_alpha_net: 0.003     # 0,3% за горизонт (§12.2, п. 4)

# --- План входа (§12.3): y_target = G(D) + медиана спреда группы + m·MAD ---
target_mad_k: 0.5        # m; [проверить]: подбирается один раз на класс на истории и фиксируется в версии конфига
min_group_size: 5        # группа «рейтинг × дюрация» меньше 5 бумаг — группового сигнала нет
spread_cancel_quantile: 0.9   # отмена идеи: G-спред выше p90 группы
duration_bucket_edges: [1, 2, 3, 5]   # годы: <1, 1–2, 2–3, 3–5, 5+
entry_buffer_pct: 0.1    # ширина зоны входа, п. % номинала
rate_shocks_bp: [100, 300]   # сценарии роста доходности для блока «против» (§7.2: ±100…300 б.п.)

# --- Разнообразие и анти-шум (§12.2, п. 6) ---
max_ideas: 5             # не больше 5 новых идей в неделю
max_per_class: 3         # не больше 3 на бакет (ofz_fixed, corp_ig)
max_per_issuer: 1        # не больше 1 на эмитента (все ОФЗ — один эмитент, Минфин)
max_candidates: 20       # топ-20 кандидатов пишутся в журнал с флагом shown

# --- Кредитный риск: ДОПУЩЕНИЯ ---
# LGD 60–70% — допущение (§7.2). [проверить]: по default-study агентств и статистике восстановления.
lgd: 0.65
# Годовая вероятность дефолта по национальной шкале (АКРА / Эксперт РА / НКР / НРА совпадают по буквам).
# ДОПУЩЕНИЕ, плейсхолдер на основе порядка величин из docs/research/07 (п. 4.9) и оценки ЦБ ~1,3% для «от A+»
# как верхней границы. [проверить]: по default-study агентств (годовые частоты дефолтов по рейтинговым категориям).
pd_annual:
  AAA: 0.0005
  AA+: 0.001
  AA: 0.002
  AA-: 0.003
  A+: 0.004
  A: 0.006
  A-: 0.009
  BBB+: 0.013
  BBB: 0.02
  BBB-: 0.03
  BB+: 0.04
  BB: 0.05
  BB-: 0.065
  B+: 0.08
  B: 0.10
  B-: 0.13

# --- Бенчмарки (§12.3): ОФЗ — подындексы RUGBITR по дюрации, корпоративные IG — RUCBTRNS ---
# [проверить]: границы дюрации подындексов по методике Мосбиржи; коды индексов меняются (RUCBTR пуст, рабочий — RUCBTRNS).
benchmarks:
  ofz_fixed:
    - {index: RUGBITR1Y, max_duration_years: 1}
    - {index: RUGBITR3Y, max_duration_years: 3}
    - {index: RUGBITR5Y, max_duration_years: 5}
    - {index: RUGBITR10Y}
  corp_ig:
    - {index: RUCBTRNS}
default_benchmark: RGBITR

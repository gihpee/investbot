# Миграции БД. URL берётся из INVESTBOT_DATABASE_URL (или SQLite в data/local), см. migrations/env.py.
# Обычный запуск: uv run investbot db upgrade
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
